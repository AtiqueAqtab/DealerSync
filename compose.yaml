services:
  postgres:
    image: postgres:17
    container_name: dealersync-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dealersync
      POSTGRES_USER: dealersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - dealersync_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealersync -d dealersync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dealersync_postgres_data: